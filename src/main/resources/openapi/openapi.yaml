openapi: 3.0.3

info:
  title: API de Remessa
  description: Desafio técnico Inter
  version: 1.0.0

servers:
  - url: http://localhost:8080

tags:
  - name: Usuario

paths:

  /usuarios:

    get:
      tags:
        - Usuario
      summary: Lista todos os usuários
      operationId: buscarUsuarios
      parameters:
        - name: pagina
          in: query
          description: Número da página (inicia em 0)
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0

        - name: quantidadePorPagina
          in: query
          description: Quantidade de registros por página
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Lista de usuários
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaUsuario'

    post:
      tags:
        - Usuario
      summary: Cria um novo usuário.
      operationId: salvarUsuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioRequest'

      responses:
        '201':
          description: Usuário criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'

  /usuarios/{id}:

    get:
      tags:
        - Usuario
      summary: Busca usuário por Id
      operationId: buscarUsuarioPorId

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Usuário encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'

        '404':
          description: Usuário não encontrado.

components:

  schemas:

    UsuarioResponse:
      type: object

      properties:
        id:
          type: integer
          format: int64

        nomeCompleto:
          type: string
          description: Nome completo do usuário.

        email:
          type: string
          description: Email de acesso do usuário.
          format: email

        identificador:
          type: string
          description: CPF ou CNPJ do usuáiro.
          pattern: '^(\d{11}|\d{14})$'

        senha:
          type: string
          description: Senha de acesso do usuário.

    UsuarioRequest:
      type: object

      required:
        - nomeCompleto
        - email
        - identificador
        - senha

      properties:
        nomeCompleto:
          type: string
          description: Nome completo do usuário.

        email:
          type: string
          description: Email de acesso do usuário.
          format: email

        identificador:
          type: string
          description: CPF ou CNPJ do usuáiro.
          pattern: '^(\d{11}|\d{14})$'

        senha:
          type: string
          description: Senha de acesso do usuário.
    PaginaUsuario:
      type: object
      properties:
        conteudo:
          type: array
          items:
            $ref: '#/components/schemas/UsuarioResponse'
        pagina:
          type: integer
          example: 0
        quantidadePagina:
          type: integer
          example: 10
        totalElementos:
          type: integer
          format: int64
          example: 53
        totalPaginas:
          type: integer
          example: 6
